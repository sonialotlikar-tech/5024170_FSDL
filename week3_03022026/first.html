<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Bootstrap Grid System</h1>

        <!-- Equal width columns -->
        <div class="row">
            <div class="col bg-primary text-white p-3">
                <h3>Column 1</h3>
                <p>Equal width column</p>
            </div>
            <div class="col bg-secondary text-white p-3">
                <h3>Column 2</h3>
                <p>Equal width column</p>
            </div>
            <div class="col bg-success text-white p-3">
                <h3>Column 3</h3>
                <p>Equal width column</p>
            </div>
        </div>

        <!-- Responsive columns -->
        <div class="row mt-4">
            <div class="col-md-4 bg-info text-white p-3">
                <h3>Column 1</h3>
                <p>4/12 width on medium screens</p>
            </div>
            <div class="col-md-8 bg-warning text-dark p-3">
                <h3>Column 2</h3>
                <p>8/12 width on medium screens</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
